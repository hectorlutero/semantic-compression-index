name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest -q
      - name: Eval suite gate
        run: logos-eval
      - name: Benchmarks (warn-only baseline)
        run: logos-bench --repeats 3
